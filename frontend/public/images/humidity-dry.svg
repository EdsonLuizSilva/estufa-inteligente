<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Sombra e Brilho Seco -->
    <filter id="dry-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#d97706" flood-opacity="0.35" />
    </filter>
    <filter id="dry-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradientes de Aridez / Ar Seco -->
    <radialGradient id="dryAura" cx="50%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#fde68a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Gota em Evaporação Âmbar / Dourada -->
    <linearGradient id="dryDrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="vaporGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="specularHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Aura Âmbar de Ar Seco -->
  <circle cx="64" cy="76" r="38" fill="url(#dryAura)" filter="url(#dry-glow)" />

  <!-- Sol Pequeno de Calor Evaporativo no Topo Direito -->
  <g transform="translate(96, 26)" filter="url(#dry-glow)">
    <circle cx="0" cy="0" r="10" fill="#f59e0b" opacity="0.8" />
    <circle cx="0" cy="0" r="6" fill="#fef08a" />
    <!-- Raios de calor secando o ar -->
    <line x1="0" y1="-14" x2="0" y2="-18" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="-10" x2="13" y2="-13" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
    <line x1="14" y1="0" x2="18" y2="0" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="10" x2="13" y2="13" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Vapores de Evaporação Subindo da Gota -->
  <g stroke="url(#vaporGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 46 42 Q 40 32 46 22 Q 52 14 46 6" />
    <path d="M 64 32 Q 58 20 64 12 Q 70 4 64 -2" />
    <path d="M 80 42 Q 74 30 80 22 Q 86 14 80 6" />
  </g>

  <!-- Gota Murcha / Diminuída (Secando) -->
  <g filter="url(#dry-shadow)">
    <!-- Formato da Gota Menor -->
    <path d="M 64 42 C 64 42 88 74 88 90 A 24 24 0 0 1 40 90 C 40 74 64 42 64 42 Z" fill="url(#dryDrop)" />

    <!-- Brilho Especular Curvo -->
    <path d="M 64 50 C 60 58 50 72 48 84 C 47 74 55 60 61 52 Z" fill="url(#specularHighlight)" />
    <ellipse cx="54" cy="74" rx="3.5" ry="6" transform="rotate(-25 54 74)" fill="#ffffff" fill-opacity="0.75" />
    <circle cx="50" cy="86" r="2" fill="#ffffff" fill-opacity="0.6" />
  </g>
</svg>
