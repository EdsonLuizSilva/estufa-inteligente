<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Sombra e Brilho Ideal -->
    <filter id="ideal-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0891b2" flood-opacity="0.4" />
    </filter>
    <filter id="cyan-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradientes Ciano / Turquesa Fresco -->
    <radialGradient id="idealAura" cx="50%" cy="65%" r="52%">
      <stop offset="0%" stop-color="#cffafe" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#a5f3fc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="idealDrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="30%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>

    <radialGradient id="idealSubsurface" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="35%" stop-color="#06b6d4" />
      <stop offset="85%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#164e63" />
    </radialGradient>

    <linearGradient id="specularHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cffafe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a5f3fc" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- Aura Úmida de Vitalidade -->
  <circle cx="64" cy="74" r="44" fill="url(#idealAura)" filter="url(#cyan-glow)" />

  <!-- Nuvem de Microclima Ativo no Fundo -->
  <g opacity="0.7" transform="translate(18, 76) scale(0.65)">
    <path d="M 25 35 A 15 15 0 0 1 50 25 A 25 25 0 0 1 95 30 A 15 15 0 0 1 110 45 L 20 45 A 15 15 0 0 1 25 35 Z" fill="url(#cloudGrad)" />
  </g>

  <!-- Gota D'água 3D Plena e Cristalina -->
  <g filter="url(#ideal-drop-shadow)">
    <!-- Forma Orgânica -->
    <path d="M 64 12 C 64 12 98 62 98 84 A 34 34 0 0 1 30 84 C 30 62 64 12 64 12 Z" fill="url(#idealSubsurface)" />

    <!-- Reflexo Interno de Luz (Fresnel) -->
    <path d="M 40 92 A 28 28 0 0 0 88 92 A 28 22 0 0 1 40 92 Z" fill="#67e8f9" fill-opacity="0.7" />

    <!-- Destaque Especular Cristalino -->
    <path d="M 64 22 C 58 35 44 56 42 74 C 40 60 52 40 60 26 Z" fill="url(#specularHighlight)" />
    <ellipse cx="50" cy="54" rx="5" ry="9" transform="rotate(-25 50 54)" fill="#ffffff" fill-opacity="0.85" />
    <circle cx="43" cy="70" r="3" fill="#ffffff" fill-opacity="0.6" />
    <circle cx="78" cy="88" r="2.5" fill="#ffffff" fill-opacity="0.45" />
  </g>

  <!-- Micro Gotículas em Suspensão Ativa (Orvalho) -->
  <g filter="url(#ideal-drop-shadow)">
    <circle cx="22" cy="54" r="6" fill="#06b6d4" />
    <ellipse cx="20.5" cy="52" rx="2" ry="1.5" fill="#ffffff" fill-opacity="0.9" />

    <circle cx="104" cy="44" r="5" fill="#06b6d4" />
    <ellipse cx="102.5" cy="42.5" rx="1.5" ry="1" fill="#ffffff" fill-opacity="0.9" />

    <circle cx="106" cy="74" r="7" fill="#0891b2" />
    <ellipse cx="104" cy="71.5" rx="2.2" ry="1.8" fill="#ffffff" fill-opacity="0.9" />
  </g>

  <!-- Centelha de Pureza / Brilho -->
  <path d="M 64 6 L 65.5 10 L 69.5 11.5 L 65.5 13 L 64 17 L 62.5 13 L 58.5 11.5 L 62.5 10 Z" fill="#ffffff" opacity="0.8" />
</svg>
