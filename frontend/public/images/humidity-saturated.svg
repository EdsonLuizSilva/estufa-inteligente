<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Sombra e Brilho Saturado -->
    <filter id="sat-drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1d4ed8" flood-opacity="0.45" />
    </filter>
    <filter id="indigo-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradientes Saturados (Cobalto e Índigo) -->
    <radialGradient id="satAura" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#bfdbfe" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#93c5fd" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="satDrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <radialGradient id="satSubsurface" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="85%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#172554" />
    </radialGradient>

    <linearGradient id="cloudHeavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe" />
      <stop offset="60%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="specularHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Aura Úmida Densa e Saturada -->
  <circle cx="64" cy="74" r="46" fill="url(#satAura)" filter="url(#indigo-glow)" />

  <!-- Nuvem Carregada com Chuva / Condensação Pesada -->
  <g transform="translate(18, 14)" filter="url(#sat-drop-shadow)">
    <!-- Forma da Nuvem de Condensação -->
    <path d="M 24 38 A 16 16 0 0 1 48 24 A 24 24 0 0 1 88 28 A 18 18 0 0 1 106 46 L 16 46 A 16 16 0 0 1 24 38 Z" fill="url(#cloudHeavy)" />
  </g>

  <!-- Gota D'água Grande e Densa Transbordando -->
  <g filter="url(#sat-drop-shadow)">
    <!-- Forma da Gota Pesada -->
    <path d="M 64 36 C 64 36 98 70 98 88 A 34 34 0 0 1 30 88 C 30 70 64 36 64 36 Z" fill="url(#satSubsurface)" />

    <!-- Reflexo de Fresnel Inferior -->
    <path d="M 40 94 A 28 28 0 0 0 88 94 A 28 22 0 0 1 40 94 Z" fill="#93c5fd" fill-opacity="0.75" />

    <!-- Destaque Especular Curvo -->
    <path d="M 64 44 C 58 54 44 70 42 82 C 40 70 52 56 60 46 Z" fill="url(#specularHighlight)" />
    <ellipse cx="50" cy="66" rx="5" ry="8.5" transform="rotate(-25 50 66)" fill="#ffffff" fill-opacity="0.85" />
    <circle cx="43" cy="78" r="2.8" fill="#ffffff" fill-opacity="0.6" />
    <circle cx="78" cy="94" r="2.5" fill="#ffffff" fill-opacity="0.5" />
  </g>

  <!-- Pingos de Chuva e Gotas de Condensação Caindo -->
  <g fill="#2563eb">
    <!-- Pingo Esquerdo Caindo -->
    <path d="M 28 84 C 28 84 32 90 32 93 A 4 4 0 0 1 24 93 C 24 90 28 84 28 84 Z" />
    <!-- Pingo Direito Caindo -->
    <path d="M 104 74 C 104 74 108 80 108 83 A 4 4 0 0 1 100 83 C 100 80 104 74 104 74 Z" />
    <!-- Pingo Inferior Esquerdo -->
    <path d="M 38 106 C 38 106 42 112 42 115 A 4 4 0 0 1 34 115 C 34 112 38 106 38 106 Z" opacity="0.8" />
    <!-- Pingo Inferior Direito -->
    <path d="M 94 102 C 94 102 98 108 98 111 A 4 4 0 0 1 90 111 C 90 108 94 102 94 102 Z" opacity="0.8" />
  </g>

  <!-- Ondulação / Anel de Respingo no Chão / Base -->
  <ellipse cx="64" cy="120" rx="36" ry="6" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.75" />
  <ellipse cx="64" cy="120" rx="20" ry="3.5" fill="none" stroke="#3b82f6" stroke-width="1.8" opacity="0.85" />
</svg>
