<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Sombra e Brilho Quente -->
    <filter id="hot-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.4" />
    </filter>
    <filter id="warmth-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradientes de Calor -->
    <radialGradient id="hotAura" cx="50%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#fed7aa" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="hotGlassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#fdba74" stop-opacity="0.75" />
    </linearGradient>

    <!-- Mercúrio Laranja/Vermelho Intenso -->
    <linearGradient id="hotMercury" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="35%" stop-color="#f97316" />
      <stop offset="70%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <radialGradient id="hotBulb" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#fb923c" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>

    <linearGradient id="glassHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Aura de Calor Radiante -->
  <circle cx="64" cy="84" r="42" fill="url(#hotAura)" filter="url(#warmth-glow)" />

  <!-- Ondas de Calor Subindo ao Redor do Termômetro -->
  <g stroke="#f97316" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 40 24 Q 44 16 40 8 Q 36 0 40 -4" />
    <path d="M 88 24 Q 92 16 88 8 Q 84 0 88 -4" />
    <path d="M 64 8 Q 67 2 64 -4" stroke="#ea580c" stroke-width="3" />
  </g>

  <!-- Sol/Aura Radiante Pequena no Topo -->
  <circle cx="102" cy="24" r="10" fill="#fb923c" opacity="0.6" filter="url(#warmth-glow)" />
  <circle cx="102" cy="24" r="6" fill="#fef08a" opacity="0.9" />

  <!-- Corpo do Termômetro -->
  <g filter="url(#hot-shadow)">
    <!-- Vidro do Tubo + Bulbo -->
    <rect x="52" y="16" width="24" height="66" rx="12" fill="#fff7ed" fill-opacity="0.5" stroke="url(#hotGlassBorder)" stroke-width="2.5" />
    <circle cx="64" cy="90" r="24" fill="#fff7ed" fill-opacity="0.5" stroke="url(#hotGlassBorder)" stroke-width="2.5" />
    <rect x="53.5" y="74" width="21" height="12" fill="#fff7ed" fill-opacity="0.5" />

    <!-- Coluna de Mercúrio ALTA (~80% da escala, y=28) -->
    <rect x="58" y="28" width="12" height="58" rx="6" fill="url(#hotMercury)" />
    <!-- Bulbo Esférico 3D Laranja/Vermelho -->
    <circle cx="64" cy="90" r="19" fill="url(#hotBulb)" />

    <!-- Marcações de Medição -->
    <line x1="74" y1="28" x2="84" y2="28" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <line x1="74" y1="38" x2="82" y2="38" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" />
    <line x1="74" y1="48" x2="80" y2="48" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" />
    <line x1="74" y1="58" x2="82" y2="58" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="74" y1="68" x2="79" y2="68" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

    <!-- Menisco do topo do líquido -->
    <ellipse cx="64" cy="28" rx="6" ry="2.5" fill="#fef08a" />

    <!-- Brilho Especular do Tubo de Vidro -->
    <path d="M 55 22 Q 55 18 59 18 L 61 18 Q 57 20 57 26 L 57 78 Q 57 82 55 84 Z" fill="url(#glassHighlight)" />

    <!-- Reflexo no Bulbo -->
    <ellipse cx="57" cy="83" rx="6" ry="3.5" transform="rotate(-35 57 83)" fill="#ffffff" fill-opacity="0.9" />
    <circle cx="53" cy="94" r="2" fill="#ffffff" fill-opacity="0.7" />
  </g>
</svg>
