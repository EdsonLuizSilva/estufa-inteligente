<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Sombra e Brilho Frio -->
    <filter id="cold-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
    <filter id="ice-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradientes de Frio -->
    <radialGradient id="coldAura" cx="50%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#7dd3fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="coldGlassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.7" />
    </linearGradient>

    <!-- Mercúrio Azul Gélido -->
    <linearGradient id="coldMercury" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <radialGradient id="coldBulb" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </radialGradient>

    <linearGradient id="glassHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Aura Fria / Gélida de Fundo -->
  <circle cx="64" cy="84" r="38" fill="url(#coldAura)" filter="url(#ice-glow)" />

  <!-- Cristais de Gelo / Flocos de Neve ao Redor -->
  <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <!-- Floco Superior Esquerdo -->
    <g transform="translate(30, 28) scale(0.7)">
      <line x1="0" y1="-10" x2="0" y2="10" />
      <line x1="-10" y1="0" x2="10" y2="0" />
      <line x1="-7" y1="-7" x2="7" y2="7" />
      <line x1="-7" y1="7" x2="7" y2="-7" />
    </g>
    <!-- Floco Superior Direito -->
    <g transform="translate(98, 38) scale(0.6)">
      <line x1="0" y1="-10" x2="0" y2="10" />
      <line x1="-10" y1="0" x2="10" y2="0" />
      <line x1="-7" y1="-7" x2="7" y2="7" />
      <line x1="-7" y1="7" x2="7" y2="-7" />
    </g>
    <!-- Cristal Pequeno Inferior -->
    <g transform="translate(24, 76) scale(0.5)">
      <line x1="0" y1="-10" x2="0" y2="10" />
      <line x1="-10" y1="0" x2="10" y2="0" />
      <line x1="-7" y1="-7" x2="7" y2="7" />
      <line x1="-7" y1="7" x2="7" y2="-7" />
    </g>
  </g>

  <!-- Corpo do Termômetro -->
  <g filter="url(#cold-shadow)">
    <!-- Vidro do Tubo + Bulbo -->
    <rect x="52" y="16" width="24" height="66" rx="12" fill="#e0f2fe" fill-opacity="0.45" stroke="url(#coldGlassBorder)" stroke-width="2.5" />
    <circle cx="64" cy="90" r="24" fill="#e0f2fe" fill-opacity="0.45" stroke="url(#coldGlassBorder)" stroke-width="2.5" />
    <rect x="53.5" y="74" width="21" height="12" fill="#e0f2fe" fill-opacity="0.45" />

    <!-- Coluna de Mercúrio BAIXA (~25% da escala) -->
    <rect x="58" y="62" width="12" height="24" rx="6" fill="url(#coldMercury)" />
    <!-- Bulbo Esférico 3D Azul Gelo -->
    <circle cx="64" cy="90" r="19" fill="url(#coldBulb)" />

    <!-- Marcações de Medição -->
    <line x1="74" y1="28" x2="80" y2="28" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="74" y1="38" x2="82" y2="38" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="74" y1="48" x2="79" y2="48" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="74" y1="58" x2="82" y2="58" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="74" y1="68" x2="79" y2="68" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />

    <!-- Menisco do topo do líquido -->
    <ellipse cx="64" cy="62" rx="6" ry="2.5" fill="#e0f2fe" />

    <!-- Brilho Especular do Tubo de Vidro -->
    <path d="M 55 22 Q 55 18 59 18 L 61 18 Q 57 20 57 26 L 57 78 Q 57 82 55 84 Z" fill="url(#glassHighlight)" />

    <!-- Reflexo no Bulbo -->
    <ellipse cx="57" cy="83" rx="6" ry="3.5" transform="rotate(-35 57 83)" fill="#ffffff" fill-opacity="0.9" />
    <circle cx="53" cy="94" r="2" fill="#ffffff" fill-opacity="0.7" />
  </g>

  <!-- Brilho de geada no topo do tubo -->
  <circle cx="64" cy="18" r="4" fill="#ffffff" fill-opacity="0.8" filter="url(#ice-glow)" />
</svg>
