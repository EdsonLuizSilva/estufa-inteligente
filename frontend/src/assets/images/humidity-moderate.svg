<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Sombra e Brilho Moderado -->
    <filter id="mod-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
    <filter id="sky-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradientes Celeste Moderado -->
    <radialGradient id="skyAura" cx="50%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#bae6fd" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="modDrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0ea5e9" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="specularHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Aura Celeste Suave -->
  <circle cx="64" cy="74" r="40" fill="url(#skyAura)" filter="url(#sky-glow)" />

  <!-- Nuvenzinha Tênue de Fundo -->
  <g opacity="0.5" transform="translate(24, 76) scale(0.6)">
    <path d="M 25 35 A 15 15 0 0 1 50 25 A 25 25 0 0 1 95 30 A 15 15 0 0 1 110 45 L 20 45 A 15 15 0 0 1 25 35 Z" fill="#bae6fd" />
  </g>

  <!-- Gota D'água Moderada -->
  <g filter="url(#mod-shadow)">
    <!-- Forma Orgânica -->
    <path d="M 64 22 C 64 22 94 66 94 84 A 30 30 0 0 1 34 84 C 34 66 64 22 64 22 Z" fill="url(#modDrop)" />

    <!-- Reflexo Interno Inferior -->
    <path d="M 44 90 A 22 22 0 0 0 84 90 A 22 16 0 0 1 44 90 Z" fill="#7dd3fc" fill-opacity="0.6" />

    <!-- Destaque Especular Curvo -->
    <path d="M 64 32 C 59 42 48 58 46 72 C 44 60 54 44 60 34 Z" fill="url(#specularHighlight)" />
    <ellipse cx="52" cy="56" rx="4" ry="7.5" transform="rotate(-25 52 56)" fill="#ffffff" fill-opacity="0.8" />
    <circle cx="45" cy="70" r="2.5" fill="#ffffff" fill-opacity="0.5" />
  </g>

  <!-- Duas Gotículas Pequenas Flutuando -->
  <circle cx="28" cy="58" r="5" fill="#38bdf8" />
  <circle cx="27" cy="56.5" r="1.5" fill="#ffffff" fill-opacity="0.85" />
  <circle cx="100" cy="50" r="4" fill="#38bdf8" />
  <circle cx="99" cy="48.5" r="1.2" fill="#ffffff" fill-opacity="0.85" />
</svg>
