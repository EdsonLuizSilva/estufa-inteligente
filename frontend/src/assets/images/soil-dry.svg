<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Sombra e Brilho Seco -->
    <filter id="dry-soil-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#92400e" flood-opacity="0.35" />
    </filter>
    <filter id="parched-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradientes de Solo Ressecado e Árido -->
    <radialGradient id="dryEarthAura" cx="50%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#fed7aa" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="dryMound" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <radialGradient id="drySoilHighlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#92400e" stop-opacity="1" />
    </radialGradient>

    <!-- Caule e Folhas Murchas (Estresse Hídrico) -->
    <linearGradient id="wiltedStem" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="50%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="wiltedLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="60%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Aura Âmbar Seca de Fundo -->
  <circle cx="64" cy="74" r="42" fill="url(#dryEarthAura)" filter="url(#parched-glow)" />

  <!-- Sombra no Chão Árido -->
  <ellipse cx="64" cy="112" rx="46" ry="9" fill="#000000" opacity="0.2" />

  <!-- Montículo de Terra Seca -->
  <g>
    <ellipse cx="64" cy="100" rx="46" ry="18" fill="url(#dryMound)" />
    <path d="M 22 101 C 30 88 52 86 64 86 C 76 86 98 88 106 101 C 96 112 76 116 64 116 C 52 116 32 112 22 101 Z" fill="url(#drySoilHighlight)" />

    <!-- Rachaduras e Fendas na Terra Árida -->
    <g stroke="#451a03" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 42 94 L 48 99 L 45 106" />
      <path d="M 48 99 L 55 102" />
      <path d="M 64 91 L 62 99 L 68 105" />
      <path d="M 62 99 L 57 101" />
      <path d="M 80 94 L 75 100 L 78 107" />
      <path d="M 75 100 L 70 102" />
      <path d="M 32 100 L 37 104" />
      <path d="M 92 98 L 86 103" />
    </g>

    <!-- Partículas e Torrões de Terra Seca -->
    <circle cx="36" cy="95" r="2.5" fill="#451a03" />
    <circle cx="88" cy="95" r="2.5" fill="#451a03" />
    <circle cx="64" cy="108" r="2" fill="#78350f" />
  </g>

  <!-- Caule Inclinado e Folhas Murchas Curvadas para Baixo -->
  <g filter="url(#dry-soil-shadow)">
    <!-- Caule Inclinado / Cansado -->
    <path d="M 64 92 C 64 78 58 64 52 48" stroke="url(#wiltedStem)" stroke-width="6.5" stroke-linecap="round" fill="none" />

    <!-- Folha Esquerda Caída para Baixo -->
    <path d="M 54 62 C 40 64 24 72 20 84 C 30 84 46 76 54 66 Z" fill="url(#wiltedLeaf)" />
    <path d="M 52 64 C 40 70 30 76 24 82" stroke="#ca8a04" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Folha Direita Inclinada e Murcha -->
    <path d="M 53 52 C 65 48 78 56 82 70 C 72 70 60 62 52 56 Z" fill="url(#wiltedLeaf)" />
    <path d="M 54 54 C 64 54 72 60 78 66" stroke="#ca8a04" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Ponta Superior Murcha -->
    <path d="M 52 48 C 50 42 46 38 42 36 C 44 42 48 46 52 48 Z" fill="#ca8a04" />
  </g>
</svg>
