<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Sombra e Brilho -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
    <filter id="mist-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradientes da Gota -->
    <radialGradient id="mistAura" cx="50%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#7dd3fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="dropMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#0ea5e9" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <radialGradient id="dropSubsurface" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="40%" stop-color="#0ea5e9" />
      <stop offset="85%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </radialGradient>

    <linearGradient id="specularHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="smallDropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Brilho Ambiente Úmido -->
  <circle cx="64" cy="74" r="42" fill="url(#mistAura)" filter="url(#mist-glow)" />

  <!-- Nuvem de Neblina / Umidade Atmosférica Suave no Fundo -->
  <g opacity="0.65" transform="translate(18, 76) scale(0.65)">
    <path d="M 25 35 A 15 15 0 0 1 50 25 A 25 25 0 0 1 95 30 A 15 15 0 0 1 110 45 L 20 45 A 15 15 0 0 1 25 35 Z" fill="url(#cloudGrad)" />
  </g>

  <!-- Gota D'água Principal 3D -->
  <g filter="url(#drop-shadow)">
    <!-- Forma Orgânica da Gota d'água -->
    <path d="M 64 12 C 64 12 98 62 98 84 A 34 34 0 0 1 30 84 C 30 62 64 12 64 12 Z" fill="url(#dropSubsurface)" />

    <!-- Reflexo interno de luz rebatida na base (Fresnel) -->
    <path d="M 40 92 A 28 28 0 0 0 88 92 A 28 22 0 0 1 40 92 Z" fill="#38bdf8" fill-opacity="0.6" />

    <!-- Destaque Especular Curvo Superior (Efeito 3D Cristalino) -->
    <path d="M 64 22 C 58 35 44 56 42 74 C 40 60 52 40 60 26 Z" fill="url(#specularHighlight)" />
    
    <!-- Ponto de Brilho Primário -->
    <ellipse cx="50" cy="54" rx="5" ry="9" transform="rotate(-25 50 54)" fill="#ffffff" fill-opacity="0.8" />
    <circle cx="43" cy="70" r="3" fill="#ffffff" fill-opacity="0.5" />
    <circle cx="78" cy="88" r="2.5" fill="#ffffff" fill-opacity="0.4" />
  </g>

  <!-- Micro Gotículas em Suspensão (Simbolizando Umidade Relativa do Ar) -->
  <g filter="url(#drop-shadow)">
    <!-- Gotícula Esquerda -->
    <circle cx="24" cy="56" r="6" fill="url(#smallDropGrad)" />
    <ellipse cx="22.5" cy="54" rx="2" ry="1.5" fill="#ffffff" fill-opacity="0.85" />

    <!-- Gotícula Direita Alta -->
    <circle cx="102" cy="44" r="5" fill="url(#smallDropGrad)" />
    <ellipse cx="100.5" cy="42.5" rx="1.5" ry="1" fill="#ffffff" fill-opacity="0.85" />

    <!-- Gotícula Direita Baixa -->
    <circle cx="106" cy="76" r="7.5" fill="url(#smallDropGrad)" />
    <ellipse cx="104" cy="73.5" rx="2.5" ry="2" fill="#ffffff" fill-opacity="0.85" />
  </g>
</svg>
