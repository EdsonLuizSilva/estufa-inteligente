<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Filtros de Sombra e Brilho -->
    <filter id="temp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.35" />
    </filter>
    <filter id="bulb-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradientes de Temperatura -->
    <radialGradient id="aura" cx="50%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#fed7aa" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffedd5" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5f9" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#e2e8f0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="mercury" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="35%" stop-color="#f97316" />
      <stop offset="70%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <radialGradient id="bulbGradient" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f97316" />
      <stop offset="70%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>

    <linearGradient id="mercuryHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Aura de Calor de Fundo -->
  <circle cx="64" cy="84" r="38" fill="url(#aura)" filter="url(#bulb-glow)" />

  <!-- Corpo de Vidro (Tubo + Bulbo) -->
  <g filter="url(#temp-shadow)">
    <!-- Fundo Interno do Tubo de Vidro -->
    <rect x="52" y="16" width="24" height="66" rx="12" fill="#e2e8f0" fill-opacity="0.5" stroke="url(#glassBorder)" stroke-width="2.5" />
    <circle cx="64" cy="90" r="24" fill="#e2e8f0" fill-opacity="0.5" stroke="url(#glassBorder)" stroke-width="2.5" />
    <!-- União interna limpa -->
    <rect x="53.5" y="74" width="21" height="12" fill="#e2e8f0" fill-opacity="0.5" />

    <!-- Líquido de Mercúrio (Coluna Vermelha/Laranja) -->
    <rect x="58" y="34" width="12" height="52" rx="6" fill="url(#mercury)" />
    <!-- Bulbo Vermelho Esférico 3D -->
    <circle cx="64" cy="90" r="19" fill="url(#bulbGradient)" />

    <!-- Marcações de Medição / Graduação -->
    <line x1="74" y1="28" x2="80" y2="28" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="74" y1="38" x2="82" y2="38" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="74" y1="48" x2="79" y2="48" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="74" y1="58" x2="82" y2="58" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="74" y1="68" x2="79" y2="68" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

    <!-- Brilho Especular 3D do Tubo de Vidro -->
    <path d="M 55 22 Q 55 18 59 18 L 61 18 Q 57 20 57 26 L 57 78 Q 57 82 55 84 Z" fill="url(#mercuryHighlight)" />

    <!-- Reflexo de Luz no Bulbo -->
    <ellipse cx="57" cy="83" rx="6" ry="3.5" transform="rotate(-35 57 83)" fill="#ffffff" fill-opacity="0.85" />
    <circle cx="53" cy="94" r="2" fill="#ffffff" fill-opacity="0.6" />

    <!-- Menisco do topo do líquido -->
    <ellipse cx="64" cy="34" rx="6" ry="2.5" fill="#fef08a" />
  </g>

  <!-- Ondas suaves de calor saindo do topo -->
  <path d="M 46 14 Q 49 8 46 3" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
  <path d="M 82 14 Q 85 8 82 3" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
</svg>
