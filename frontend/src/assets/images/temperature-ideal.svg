<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Sombra e Brilho Ideal -->
    <filter id="ideal-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#16a34a" flood-opacity="0.35" />
    </filter>
    <filter id="leaf-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradientes Ideais (Esmeralda Botânico) -->
    <radialGradient id="idealAura" cx="50%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#dcfce7" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#bbf7d0" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#86efac" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="idealGlassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#86efac" stop-opacity="0.7" />
    </linearGradient>

    <!-- Mercúrio Verde Esmeralda Botânico -->
    <linearGradient id="idealMercury" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="35%" stop-color="#22c55e" />
      <stop offset="70%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <radialGradient id="idealBulb" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bbf7d0" />
      <stop offset="25%" stop-color="#4ade80" />
      <stop offset="70%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </radialGradient>

    <linearGradient id="glassHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
  </defs>

  <!-- Aura Suave de Clorofila / Harmonia -->
  <circle cx="64" cy="84" r="38" fill="url(#idealAura)" filter="url(#leaf-glow)" />

  <!-- Brotinho Botânico Fresco ao Lado do Termômetro -->
  <g filter="url(#leaf-glow)" transform="translate(18, 54)">
    <!-- Caule curvo -->
    <path d="M 16 38 Q 8 20 2 12" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Folha Esquerda -->
    <path d="M 2 12 C -6 8 -8 18 2 24 C 6 20 8 14 2 12 Z" fill="url(#sproutGrad)" />
    <!-- Folha Direita -->
    <path d="M 6 22 C 16 16 18 26 8 32 C 4 28 4 24 6 22 Z" fill="url(#sproutGrad)" />
  </g>

  <!-- Corpo do Termômetro -->
  <g filter="url(#ideal-shadow)">
    <!-- Vidro do Tubo + Bulbo -->
    <rect x="52" y="16" width="24" height="66" rx="12" fill="#f0fdf4" fill-opacity="0.5" stroke="url(#idealGlassBorder)" stroke-width="2.5" />
    <circle cx="64" cy="90" r="24" fill="#f0fdf4" fill-opacity="0.5" stroke="url(#idealGlassBorder)" stroke-width="2.5" />
    <rect x="53.5" y="74" width="21" height="12" fill="#f0fdf4" fill-opacity="0.5" />

    <!-- Coluna de Mercúrio na ALTURA IDEAL (~55% da escala) -->
    <rect x="58" y="46" width="12" height="40" rx="6" fill="url(#idealMercury)" />
    <!-- Bulbo Esférico 3D Verde -->
    <circle cx="64" cy="90" r="19" fill="url(#idealBulb)" />

    <!-- Marcações de Medição -->
    <line x1="74" y1="28" x2="80" y2="28" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="74" y1="38" x2="82" y2="38" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="74" y1="48" x2="84" y2="48" stroke="#16a34a" stroke-width="3" stroke-linecap="round" />
    <line x1="74" y1="58" x2="82" y2="58" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" />
    <line x1="74" y1="68" x2="79" y2="68" stroke="#16a34a" stroke-width="2" stroke-linecap="round" />

    <!-- Menisco do topo do líquido -->
    <ellipse cx="64" cy="46" rx="6" ry="2.5" fill="#bbf7d0" />

    <!-- Brilho Especular do Tubo de Vidro -->
    <path d="M 55 22 Q 55 18 59 18 L 61 18 Q 57 20 57 26 L 57 78 Q 57 82 55 84 Z" fill="url(#glassHighlight)" />

    <!-- Reflexo no Bulbo -->
    <ellipse cx="57" cy="83" rx="6" ry="3.5" transform="rotate(-35 57 83)" fill="#ffffff" fill-opacity="0.9" />
    <circle cx="53" cy="94" r="2" fill="#ffffff" fill-opacity="0.7" />
  </g>

  <!-- Partícula Suave de Vitalidade -->
  <circle cx="100" cy="48" r="3" fill="#4ade80" opacity="0.8" />
  <circle cx="94" cy="36" r="2" fill="#86efac" opacity="0.6" />
</svg>
