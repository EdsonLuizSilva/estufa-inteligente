<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Sombra e Brilho Ideal -->
    <filter id="ideal-soil-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14532d" flood-opacity="0.3" />
    </filter>
    <filter id="sprout-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradientes de Solo Fértil -->
    <linearGradient id="soilMound" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="40%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#271003" />
    </linearGradient>

    <radialGradient id="soilHighlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#92400e" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#451a03" stop-opacity="1" />
    </radialGradient>

    <!-- Planta e Folhas Vigorosas -->
    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <linearGradient id="leafLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="40%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <linearGradient id="leafRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="40%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <radialGradient id="sproutAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dcfce7" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#bbf7d0" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#86efac" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="dewDropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Aura de Clorofila e Saúde -->
  <circle cx="64" cy="55" r="45" fill="url(#sproutAura)" filter="url(#sprout-glow)" />

  <!-- Sombra no Chão -->
  <ellipse cx="64" cy="112" rx="48" ry="10" fill="#000000" opacity="0.25" />

  <!-- Montículo de Terra Fértil e Substrato Úmido -->
  <g>
    <ellipse cx="64" cy="100" rx="46" ry="18" fill="url(#soilMound)" />
    <path d="M 22 101 C 30 88 52 86 64 86 C 76 86 98 88 106 101 C 96 112 76 116 64 116 C 52 116 32 112 22 101 Z" fill="url(#soilHighlight)" />

    <!-- Partículas Texturizadas de Substrato Rico -->
    <circle cx="36" cy="98" r="3.5" fill="#271003" />
    <circle cx="48" cy="94" r="2.5" fill="#78350f" />
    <circle cx="58" cy="92" r="3" fill="#1c0b02" />
    <circle cx="72" cy="93" r="3.5" fill="#271003" />
    <circle cx="84" cy="96" r="2.5" fill="#78350f" />
    <circle cx="92" cy="100" r="3" fill="#1c0b02" />
  </g>

  <!-- Planta Eretiva, Saudável e Viçosa -->
  <g filter="url(#ideal-soil-shadow)">
    <!-- Caule Forte e Vertical -->
    <path d="M 64 92 C 64 74 62 58 64 36" stroke="url(#stemGrad)" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 64 54 C 64 45 64 38 64 34" stroke="#86efac" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Folha Esquerda Perfeita -->
    <path d="M 63 60 C 44 60 22 48 18 34 C 30 30 52 38 63 52 Z" fill="url(#leafLeft)" />
    <path d="M 63 56 C 48 50 34 42 22 36" stroke="#86efac" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.75" />

    <!-- Folha Direita Aberta com Brilho -->
    <path d="M 64 48 C 76 34 94 24 110 26 C 108 42 94 56 65 54 Z" fill="url(#leafRight)" />
    <path d="M 65 52 C 80 44 94 36 106 28" stroke="#dcfce7" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Broto Central Nascente -->
    <path d="M 64 36 C 61 28 62 18 64 14 C 66 18 67 28 64 36 Z" fill="#4ade80" />

    <!-- Gota de Orvalho Reluzente na Folha Direita -->
    <g transform="translate(90, 32)">
      <circle cx="0" cy="0" r="4.5" fill="url(#dewDropGrad)" />
      <ellipse cx="-1.5" cy="-1.5" rx="1.5" ry="1" fill="#ffffff" fill-opacity="0.9" />
    </g>

    <!-- Gotícula de Absorção no Solo Úmido -->
    <g transform="translate(42, 88) scale(0.7)">
      <path d="M 0 -8 C 0 -8 5 0 5 4 A 5 5 0 0 1 -5 4 C -5 0 0 -8 0 -8 Z" fill="#38bdf8" />
      <ellipse cx="-1.5" cy="3" rx="1.2" ry="1.8" fill="#ffffff" fill-opacity="0.8" />
    </g>
  </g>
</svg>
